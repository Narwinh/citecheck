[project]
name = "citecheck"
version = "0.1.0"
description = "Multi-agent research assistant that verifies every citation it makes."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-core>=1.6,<2",
    "google-genai>=2.25,<3",
    "tavily-python>=0.8.4,<0.9",
    "chromadb>=1.5,<2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.40",
    "slowapi>=0.1.10,<0.2",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external APIs (needs keys in .env); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
